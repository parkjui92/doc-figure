<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
/*__STYLE_TOKENS__*/
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; }
#figure { width:1500px; word-break:var(--word-break); display:var(--fig-display); flex-direction:column; background:var(--bg); font-family:var(--font); color:var(--ink);
  padding:34px 44px 30px; -webkit-font-smoothing:antialiased; }
.hd { text-align:var(--title-align); border-bottom:var(--title-under); padding-bottom:var(--title-under-gap); margin-bottom:20px; }
.hd .title-row { display:flex; align-items:center; justify-content:var(--title-align); gap:20px; }
.hd .rule { display:var(--title-deco); flex:1; height:3px; background:var(--navy-deep); position:relative; max-width:340px; }
.hd .rule::before,.hd .rule::after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--navy-deep);}
.hd .rule.l::before{left:-2px;} .hd .rule.r::after{right:-2px;}
.hd h1 { font-size:calc(38px * var(--title-scale)); font-family:var(--font-title); font-weight:var(--w-title); color:var(--title-ink); letter-spacing:var(--title-track); white-space:nowrap; }
.hd .sub { margin-top:12px; font-size:calc(20px * var(--text-scale)); font-weight:var(--w-label); color:var(--ink-soft); }

.stage { position:relative; height:640px; }
.hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:280px; min-height:150px;
  background:var(--strong-fill); color:var(--strong-ink); border-radius:calc(var(--radius-box) + 8px); display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; padding:22px; box-shadow:var(--strong-ring), var(--shadow-hub); z-index:3; }
.hub .ht { font-size:calc(26px * var(--text-scale)); font-weight:var(--w-title); line-height:1.25; }
.hub .hd2 { margin-top:8px; font-size:calc(16px * var(--text-scale)); font-weight:var(--w-body); color:var(--strong-ink-soft); line-height:1.4; white-space:pre-line; }
.sup { position:absolute; width:290px; transform:translateY(-50%); background:var(--card-fill); border:2px solid var(--bar-border);
  border-radius:calc(var(--radius-box) + 2px); padding:15px 16px; box-shadow:var(--shadow); z-index:2; }
.sup .stt { font-size:calc(19px * var(--text-scale)); font-weight:var(--w-strong); color:var(--navy-deep); line-height:1.25; }
.sup .sdd { margin-top:6px; font-size:calc(15px * var(--text-scale)); font-weight:var(--w-body); color:var(--ink); line-height:1.4; white-space:pre-line; }
.sup.left { left:0; text-align:right; } .sup.right { right:0; text-align:left; }
svg.links { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
.caption { order:var(--caption-order); text-align:var(--caption-align); margin-top:calc(18px * var(--caption-mt)); margin-bottom:var(--caption-mb); font-size:var(--caption-size); font-weight:var(--caption-weight); color:var(--caption-ink); }
.unit { order:var(--caption-order); text-align:right; font-size:var(--src-size); color:var(--ink-soft); margin:-6px 0 6px; }
.src { order:20; text-align:left; margin-top:var(--src-gap); font-size:var(--src-size); font-weight:var(--w-body); color:var(--ink-soft); line-height:1.5; white-space:pre-line; }
#figure::before { content:""; display:var(--title-tag); order:-2; width:46px; height:14px; background:var(--title-tag-color); margin-bottom:12px; }

</style>
</head>
<body>
<div id="figure"></div>
<script>
const FIGURE=/*__FIGURE_DATA__*/ null; const ICONS=/*__ICONS__*/ {};
(function(){
  const F=FIGURE, root=document.getElementById('figure');
  const hd=div('hd'),tr=div('title-row'); tr.append(div('rule l'),t('h1',null,F.title),div('rule r')); hd.append(tr);
  if(F.subtitle) hd.append(t('div','sub',F.subtitle)); root.append(hd);
  const stage=div('stage'); root.append(stage);
  const hub=div('hub'); hub.append(t('div','ht',F.center.title));
  if(F.center.desc) hub.append(t('div','hd2',F.center.desc)); stage.append(hub);

  const sups=F.supports||[]; const half=Math.ceil(sups.length/2);
  const leftN=sups.slice(0,half), rightN=sups.slice(half);
  const H=640, W=1500-88; // stage inner width (padding 44*2)
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg"); svg.setAttribute("class","links");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); stage.append(svg);
  const cx=W/2, cy=H/2;
  function place(list, side){
    const n=list.length; list.forEach((s,i)=>{
      const el=div('sup '+side); const top=(n===1)?H/2:(H*0.16 + (H*0.68)*(i/(n-1)));
      el.style.top=top+'px';
      el.append(t('div','stt',s.title)); if(s.desc) el.append(t('div','sdd',s.desc));
      stage.append(el);
      const y=top; const x=(side==='left')? 290 : W-290;
      const ln=document.createElementNS(svgNS,"path");
      const mx=(side==='left')? (cx-150) : (cx+150);
      ln.setAttribute("d","M "+x+" "+y+" C "+((x+mx)/2)+" "+y+", "+((x+mx)/2)+" "+cy+", "+mx+" "+cy);
      ln.setAttribute("fill","none"); ln.setAttribute("stroke-width","2.5");
      ln.style.stroke="var(--bar-border)"; svg.append(ln);
      const dot=document.createElementNS(svgNS,"circle"); dot.setAttribute("cx",x); dot.setAttribute("cy",y);
      dot.setAttribute("r","5"); dot.style.fill="var(--navy-marker)"; svg.append(dot);
    });
  }
  place(leftN,'left'); place(rightN,'right');
  if(F.caption) root.append(t('div','caption',F.caption));
  if(F.unit) root.append(t('div','unit',/^\(/.test(F.unit)?F.unit:'(단위: '+F.unit+')'));
  if(F.footnote) root.append(t('div','src',/^(주|※|Note)/.test(F.footnote)?F.footnote:'주: '+F.footnote));
  if(F.source) root.append(t('div','src',/^(자료|출처|Source)/.test(F.source)?F.source:'자료: '+F.source));
  window.__RENDER_DONE__=true; window.__TEXT_ECHO__=root.innerText.replace(/\s+/g,' ').trim();
  function div(c){const e=document.createElement('div');if(c)e.className=c;return e;}
  function t(tag,c,txt){const e=document.createElement(tag);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
})();
</script>
</body>
</html>
