<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
/*__STYLE_TOKENS__*/
/* =========================================================================
   viz — 디자인 보고서풍 구조도 5종 + 데이터 그래프 9종 (v2.2, 2026-11-20)
   해외 보고서 벤치마크(references/benchmark-intl-2026.md)에서 반복해 나온 형태.
   spec 의 "template" 에 형태 이름을 바로 쓴다 (render_figure.py 가 viz 로 돌린다).

   구조도  funnel-stack 쌓은 깔때기 · growing-circles 커지는 원 · circle-chain 겹치는 원 사슬
           ring-core 순환 고리와 핵심어 · ribbon-list 꼬리표 목록 · stat-strip 큰 숫자 묶음
   그래프  bar-highlight 강조 막대 · bar-line 막대+선 · line-highlight 강조 선 · slope 기울기
           dumbbell 아령 · range-bar 범위 막대 · bubble-compare 비례 원
           small-multiples 작은 그래프 묶음 · stacked-share 구성비 누적 막대
   유량·연결 (v2.2.1)  sankey 유량도 · link-map 연결도(열 사이 연결) · network 연결망
   기존 도식 형태 14종의 새 디자인 (v2.3)  cycle · funnel · venn · quadrant · pyramid · concentric · hub · fishbone
           staircase · before-after · waterfall · iceberg · swimlane · logic-tree — forms.html 과 같은 사양을 받는다
   기존 템플릿 11종의 새 디자인 (v2.4)  flow-process · org-chart · structure-block · layer-stack · concept-argument · comparison-matrix
           matrix-heatmap · decision-flow · timeline-gantt · timeline-tracks · pipe-mapping — 각 템플릿 html 과 같은 사양을 받는다

   도형은 SVG, 글자는 절대배치 HTML — 한국어 줄바꿈을 브라우저가 맡는다.
   색은 전부 토큰(tone 6가지). 그라데이션·입체는 프리셋 토큰 --gloss·--solid 가 0 이면 꺼진다
   (house 등 기존 프리셋은 0 — 평면. design-report 프리셋만 켠다).
   글자 크기는 프리셋 --text-scale 과 무관하게 고정(16cm 폭에 넣을 때 본문 8pt·최소 7pt 이상).
   배치 점검: 글자 겹침·그림 밖 이탈·도형보다 큰 글자를 스스로 재서 __layout_issues 에 적는다.
   ========================================================================= */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; }
#figure { width:1500px; word-break:keep-all; display:var(--fig-display); flex-direction:column; background:var(--bg); font-family:var(--font); color:var(--ink);
  padding:34px 44px 30px; -webkit-font-smoothing:antialiased; }
.hd { text-align:var(--title-align); border-bottom:var(--title-under); padding-bottom:var(--title-under-gap); margin-bottom:26px; }
.hd .title-row { display:flex; align-items:center; justify-content:var(--title-align); gap:20px; }
.hd .rule { display:var(--title-deco); flex:1; height:3px; background:var(--navy-deep); position:relative; max-width:340px; }
.hd .rule::before,.hd .rule::after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--navy-deep);}
.hd .rule.l::before{left:-2px;} .hd .rule.r::after{right:-2px;}
.hd h1 { font-size:calc(38px * var(--title-scale)); font-family:var(--font-title); font-weight:var(--w-title); color:var(--title-ink); letter-spacing:var(--title-track); line-height:1.25; }
.hd .sub { margin-top:10px; font-size:30px; font-weight:var(--w-label); color:var(--ink-soft); line-height:1.35; }
.caption { order:var(--caption-order); text-align:var(--caption-align); margin-top:calc(24px * var(--caption-mt)); margin-bottom:var(--caption-mb); font-size:var(--caption-size); font-weight:var(--caption-weight); color:var(--caption-ink); }
.src { order:20; text-align:left; margin-top:var(--src-gap); font-size:var(--src-size); font-weight:var(--w-body); color:var(--ink-soft); line-height:1.5; white-space:pre-line; }
.unit { text-align:left; font-size:26px; font-weight:var(--w-label); color:var(--ink-soft); margin:-8px 0 10px; }
.concl { order:19; font-size:28px; font-weight:var(--w-strong); color:var(--tone-go); line-height:1.42; margin-top:14px; white-space:pre-line; }
.takeaway { font-size:30px; font-weight:var(--w-strong); color:var(--navy-deep); line-height:1.4; margin:-6px 0 18px; padding-left:16px; border-left:6px solid var(--tone-wait); }
#figure::before { content:""; display:var(--title-tag); order:-2; width:46px; height:14px; background:var(--title-tag-color); margin-bottom:12px; }

.vz-stage { position:relative; margin:0 auto; }
.vz-stage > svg { position:absolute; left:0; top:0; overflow:visible; }
.lb { position:absolute; white-space:pre-line; line-height:1.3; text-align:center; z-index:2; color:var(--ink); font-size:27px; font-weight:var(--w-body); }
.lb.al { text-align:left; } .lb.ar { text-align:right; } .lb.nw { white-space:pre; }
.lb .h1 { font-size:34px; font-weight:var(--w-title); line-height:1.22; color:var(--navy-deep); }
.lb .h2 { font-size:29px; font-weight:var(--w-title); line-height:1.24; color:var(--navy-deep); }
.lb .b  { font-size:27px; font-weight:var(--w-body); color:var(--ink); }
.lb .bb { font-size:27px; font-weight:var(--w-strong); color:var(--ink); }
.lb .s  { font-size:24px; font-weight:var(--w-body); color:var(--ink-soft); line-height:1.32; }
.lb .sb { font-size:24px; font-weight:var(--w-strong); color:var(--ink-soft); line-height:1.32; }
.lb .v  { font-size:28px; font-weight:var(--w-title); color:var(--ink); font-variant-numeric:tabular-nums; }
.lb .vs { font-size:24px; font-weight:var(--w-label); color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.lb span.vs { white-space:pre; }
.lb .big{ font-size:46px; font-weight:var(--w-title); color:var(--navy-deep); line-height:1.05; font-variant-numeric:tabular-nums; }
.lb.halo div { text-shadow:-2px 0 #fff, 2px 0 #fff, 0 -2px #fff, 0 2px #fff, -2px -2px #fff, 2px 2px #fff, -2px 2px #fff, 2px -2px #fff; }
.lb.on div { color:#fff; } .lb.on .s { opacity:.92; }
.lb .bul { text-align:left; padding-left:20px; text-indent:-20px; }
.lb .bul::before { content:"· "; font-weight:var(--w-title); }
.lb .tag { display:inline-block; font-size:23px; font-weight:var(--w-strong); color:#fff; background:var(--tone-wait); border-radius:5px; padding:1px 10px 2px; margin-right:10px; text-indent:0; }
.lb .lim { font-size:25px; font-weight:var(--w-label); color:var(--tone-wait); line-height:1.34; margin-top:6px; text-align:left; }
.lb .huge { font-size:68px; font-weight:var(--w-title); line-height:1.05; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; }
.lb .huge small { font-size:34px; font-weight:var(--w-strong); letter-spacing:0; margin-left:4px; }
.lb .deco { font-size:104px; font-weight:var(--w-title); line-height:1; opacity:.16; }
.lg { display:flex; flex-wrap:wrap; gap:8px 30px; align-items:center; margin:0 0 14px; font-size:25px; font-weight:var(--w-label); color:var(--ink); }
.lg span.i { display:inline-flex; align-items:center; gap:9px; }
.lg i { display:inline-block; width:26px; height:16px; border-radius:3px; }
.lg i.dot { width:18px; height:18px; border-radius:50%; } .lg i.ln { height:5px; border-radius:3px; }
svg .ax { stroke:var(--neutral-line); fill:none; stroke-width:2; }
svg .gr { stroke:var(--grid-line); fill:none; stroke-width:1.5; }
svg .grd { stroke:var(--grid-line); fill:none; stroke-width:1.5; stroke-dasharray:5 6; }
svg .ref { stroke:var(--ink-soft); fill:none; stroke-width:2; stroke-dasharray:7 6; }
</style>
</head>
<body>
<div id="figure"></div>
<pre id="__layout_issues" style="display:none">[]</pre>
<script>
const FIGURE = /*__FIGURE_DATA__*/ null;
const ICONS  = /*__ICONS__*/ {};
(function(){
  const F=FIGURE, root=document.getElementById('figure'), W=1412, NS="http://www.w3.org/2000/svg";
  const D=F.data||F, kind=F.viz||F.template; root.classList.add('v-'+kind);
  const CS=getComputedStyle(root), GL=parseFloat(CS.getPropertyValue('--gloss'))||0, SOLID=(parseFloat(CS.getPropertyValue('--solid'))||0)>0;
  let uid=0; const TN=['main','sub','go','wait','stop','mute'];
  if(F.title){ const hd=div('hd'),tr=div('title-row'); tr.append(div('rule l'),t('h1',null,F.title),div('rule r')); hd.append(tr);
    if(F.subtitle) hd.append(t('div','sub',F.subtitle)); root.append(hd); }
  if(F.takeaway) root.append(t('div','takeaway',F.takeaway));
  const R={'funnel-stack':funnelStack,'growing-circles':growingCircles,'circle-chain':circleChain,'ring-core':ringCore,'ribbon-list':ribbonList,'stat-strip':statStrip,
           'bar-highlight':barHighlight,'bar-line':barLine,'line-highlight':lineHighlight,'slope':slope,'dumbbell':d=>rangeLike(d,'dumbbell'),
           'range-bar':d=>rangeLike(d,'range'),'bubble-compare':bubbleCompare,'small-multiples':smallMultiples,'stacked-share':stackedShare,
           'sankey':sankey,'link-map':linkMap,'network':network,
           'pyramid':pyramidX,'venn':vennX,'cycle':cycleX,'funnel':funnelX,'quadrant':quadrantX,'concentric':concentricX,'hub':hubX,
           'fishbone':fishboneX,'staircase':staircaseX,'before-after':beforeAfterX,'waterfall':waterfallX,'iceberg':icebergX,'swimlane':swimlaneX,'logic-tree':logicTreeX,
           'flow-process':flowProcessX,'org-chart':orgChartX,'structure-block':structureBlockX,'layer-stack':layerStackX,'concept-argument':conceptArgumentX,
           'comparison-matrix':comparisonMatrixX,'matrix-heatmap':matrixHeatmapX,'decision-flow':decisionFlowX,'timeline-gantt':timelineGanttX,'timeline-tracks':timelineTracksX,'pipe-mapping':pipeMappingX};
  const issues=[];
  if(!R[kind]) { issues.push('스크립트 오류: 알 수 없는 형태 '+kind); root.append(t('div','caption','[viz] 알 수 없는 형태: '+kind)); }
  else { try { R[kind](D); } catch(e) { issues.push('스크립트 오류: '+kind+' — '+e.message); const m=t('div','caption','[viz 오류] '+kind+': '+e.message); m.style.color='red'; root.append(m); console.error(e); } }
  if(F.conclusion) root.append(t('div','concl',F.conclusion));   // 그림 바로 아래 색 글씨 결론 한두 줄 — 제목이 명사구(<그림 n> 관례)일 때
  if(F.caption) root.append(t('div','caption',F.caption));
  if(F.footnote) root.append(t('div','src',/^(주|※|Note)/.test(F.footnote)?F.footnote:'주: '+F.footnote));
  if(F.source) root.append(t('div','src',/^(자료|출처|Source)/.test(F.source)?F.source:'자료: '+F.source));
  check(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(check);
  window.__RENDER_DONE__=true;

  // ───────────────────────── 공용 ─────────────────────────
  function div(c){const e=document.createElement('div'); if(c)e.className=c; return e;}
  function t(tag,c,txt){const e=document.createElement(tag); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}
  function el(tag,a,st){const e=document.createElementNS(NS,tag); for(const k in (a||{})) e.setAttribute(k,a[k]); if(st) e.setAttribute('style',st); return e;}
  function stage(h){
    const s=div('vz-stage'); s.style.width=W+'px'; s.style.height=h+'px';
    const svg=el('svg',{width:W,height:h,viewBox:'0 0 '+W+' '+h}); svg.append(el('defs'));
    s.append(svg); root.append(s);
    return {el:s, svg, defs:svg.firstChild, get h(){return h;}, set h(v){ h=v; s.style.height=v+'px'; svg.setAttribute('height',v); svg.setAttribute('viewBox','0 0 '+W+' '+v); }};
  }
  function add(st,tag,a,style){const e=el(tag,a,style); st.svg.append(e); return e;}
  function tc(n,s){ return 'var(--tone-'+(TN.includes(n)?n:'main')+(s?'-'+s:'')+')'; }
  function fmt(v,dec){ if(v==null||isNaN(v)) return ''; const d=(dec!=null)?dec:(Math.abs(v)<10&&v%1!==0?1:(v%1!==0?1:0));
    return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  // 글자 상자 — anchor: c l r t b tl tr bl br. w 없으면 한 줄.
  function mk(w,parts,o){ o=o||{}; const e=div('lb '+(o.cls||'')); if(w) e.style.width=w+'px'; else e.classList.add('nw');
    if(o.align==='l') e.classList.add('al'); if(o.align==='r') e.classList.add('ar'); if(o.color) e.style.color=o.color;
    if(o.fit) e.dataset.fit=o.fit.join(','); if(o.deco) e.dataset.deco='1';
    parts.forEach(p=>{ if(p && p[0]!=null && p[0]!==''){ const c=t('div',p[1],String(p[0])); if(p[2]) c.style.color=p[2]; e.append(c); } });
    return e; }
  function lab(st,x,y,w,parts,o){ o=o||{}; const e=mk(w,parts,o);
    const tf={c:'translate(-50%,-50%)',l:'translate(0,-50%)',r:'translate(-100%,-50%)',t:'translate(-50%,0)',b:'translate(-50%,-100%)',tl:'none',tr:'translate(-100%,0)',bl:'translate(0,-100%)',br:'translate(-100%,-100%)'}[o.anchor||'c'];
    e.style.left=x+'px'; e.style.top=y+'px'; e.style.transform=tf; st.el.append(e); return e; }
  function measure(w,parts,o){ const e=mk(w,parts,o); e.style.visibility='hidden'; e.style.left='0'; e.style.top='0'; root.append(e);
    const r={w:e.offsetWidth,h:e.offsetHeight}; e.remove(); return r; }
  function rad(d){ return d*Math.PI/180; }
  function grad(st,stops,o){ const id='g'+(++uid), g=el(o&&o.radial?'radialGradient':'linearGradient',Object.assign({id},o&&o.attrs||{x1:0,y1:0,x2:0,y2:1}));
    stops.forEach(s=>g.append(el('stop',{offset:s[0]},'stop-color:'+s[1]+';stop-opacity:'+(s[2]==null?1:s[2])))); st.defs.append(g); return 'url(#'+id+')'; }
  function legend(items){ const g=div('lg'); items.forEach(m=>{ const s=t('span','i'), i=t('i',m.shape||''); i.style.background=m.color; s.append(i, document.createTextNode(m.label)); g.append(s); }); root.append(g); return g; }
  function niceTicks(lo,hi,n){ n=n||5; if(hi===lo) hi=lo+1; const raw=(hi-lo)/n, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p, step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
    const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, out=[]; for(let v=a; v<=b+step*1e-6; v+=step) out.push(Math.round(v/step)*step); return out; }
  function tickDec(tk){ const s=tk.length>1?Math.abs(tk[1]-tk[0]):1; return s>=1?0:(s>=0.1?1:2); }
  // 세로로 겹치는 이름표를 밀어 벌린다 (y 오름차순, 최소 간격 gap, 범위 lo~hi)
  function spread(ys,gap,lo,hi){ const idx=ys.map((y,i)=>i).sort((a,b)=>ys[a]-ys[b]), out=ys.slice();
    for(let k=1;k<idx.length;k++){ if(out[idx[k]]-out[idx[k-1]]<gap) out[idx[k]]=out[idx[k-1]]+gap; }
    const over=out[idx[idx.length-1]]-hi; if(over>0){ for(let k=idx.length-1;k>=0;k--){ out[idx[k]]-=over; if(k>0 && out[idx[k]]-out[idx[k-1]]>=gap) break; else if(k>0) out[idx[k-1]]=Math.min(out[idx[k-1]],out[idx[k]]-gap); } }
    return out.map(v=>Math.max(lo,v)); }
  function check(){
    const out=issues.slice();
    root.querySelectorAll('.vz-stage').forEach(s=>{ const B=s.getBoundingClientRect();
      const L=[...s.querySelectorAll('.lb')].filter(e=>e.textContent.trim() && !e.dataset.deco).map(e=>{ const r=document.createRange(); r.selectNodeContents(e); const q=r.getBoundingClientRect();
        return {e,l:q.left,t:q.top,r:q.right,b:q.bottom,txt:e.textContent.trim().replace(/\s+/g,' ').slice(0,16)}; });
      L.forEach(a=>{ if(a.l<B.left-4||a.r>B.right+4||a.t<B.top-4||a.b>B.bottom+4) out.push("글자가 그림 밖으로 나감: '"+a.txt+"'");
        if(a.e.dataset.fit){ const f=a.e.dataset.fit.split(',').map(Number); if((a.r-a.l)>f[0]+3||(a.b-a.t)>f[1]+3) out.push("글자가 도형보다 큼(글을 줄일 것): '"+a.txt+"'"); }
        if(a.e.scrollWidth>a.e.clientWidth+3) out.push("글자가 칸을 넘침: '"+a.txt+"'"); });
      for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){ const a=L[i], b=L[j], ix=Math.min(a.r,b.r)-Math.max(a.l,b.l), iy=Math.min(a.b,b.b)-Math.max(a.t,b.t);
        if(ix>4&&iy>4) out.push("글자 겹침: '"+a.txt+"' × '"+b.txt+"'"); }
    });
    document.getElementById('__layout_issues').textContent=JSON.stringify([...new Set(out)]);
  }

  // ═════════════════════════ 구조도 ═════════════════════════
  // ───────── funnel-stack 쌓은 깔때기 ─────────
  // stages[{name,sub,core,core_sub,desc,limit{tag,text},tone,next{text,desc}}]  numbered:true 면 옅은 큰 번호
  function funnelStack(d){
    const S=d.stages, n=S.length, cx=590, W0=d.top_width||520, nameX=30, nameW=cx-W0/2-nameX-36, descX=cx+W0/2+92, descW=W-descX-8;
    const ratio=Math.pow(Math.max(0.3,(d.bottom_width||170)/W0),1/n), def=i=>i===n-1?'wait':(i===0?'go':(i===n-2&&n>2?'main':'sub'));
    const descParts=o=>{ const p=[]; if(!o) return p; [].concat(o.desc||[]).forEach(x=>p.push([x,'b'])); return p; };
    const st=stage(100); let y=d.numbered?46:14; const G=[];
    S.forEach((s,i)=>{ const tn=s.tone||def(i), tw=W0*Math.pow(ratio,i), bw=tw*Math.pow(ratio,0.8);
      const dp=descParts(s), dh=measure(descW,dp,{align:'l'}).h + (s.limit?measure(descW,[[(s.limit.tag||'')+'  '+s.limit.text,'lim']],{align:'l'}).h+6:0);
      const nh=measure(nameW,[[s.name,'h2'],[s.sub,'s']],{align:'l'}).h, ch=measure(bw-30,[[s.core,'h2'],[s.core_sub,'s']]).h;
      const bh=Math.max(128,dh+32,nh+36,ch+52), nx=s.next, nt=nx?(typeof nx==='string'?{text:nx}:nx):null;
      const gh=(i<n-1)?Math.max(46,nt?Math.max(measure(tw*ratio+60,[[nt.text,'bb']]).h,measure(descW,descParts(nt),{align:'l'}).h)+58:46):0;
      G.push({s,tn,tw,bw,y,bh,gh,nt,dp}); y+=bh+gh; });
    st.h=y+26;
    G.forEach((g,i)=>{ const s=g.s, y0=g.y, y1=g.y+g.bh, spout=(i<n-1?20:14), yb=y1+spout, a=g.tw/2, b=g.bw/2, cy=(y0+y1)/2;
      add(st,'rect',{x:0,y:y0,width:W,height:g.bh},'fill:'+tc(g.tn,'tint'));
      if(d.numbered) lab(st,nameX-6,y0-58,0,[[String(i+1),'deco',tc(g.tn)]],{anchor:'tl',deco:1});
      if(SOLID){ const ry=Math.max(10,g.tw*0.04), rb=Math.max(7,g.bw*0.05), yt=y0-4;
        const p=`M${cx-a} ${yt} C ${cx-a} ${yt+(yb-yt)*0.5}, ${cx-b} ${yb-(yb-yt)*0.42}, ${cx-b} ${yb-rb} A ${b} ${rb} 0 0 0 ${cx+b} ${yb-rb} C ${cx+b} ${yb-(yb-yt)*0.42}, ${cx+a} ${yt+(yb-yt)*0.5}, ${cx+a} ${yt} A ${a} ${ry} 0 0 1 ${cx-a} ${yt} Z`;
        add(st,'path',{d:p},'fill:'+tc(g.tn));
        if(GL>0) add(st,'path',{d:p},'fill:'+grad(st,[[0,'#000',GL*0.9],[0.3,'#fff',GL*0.9],[0.62,'#fff',0],[1,'#000',GL*1.3]],{attrs:{x1:0,y1:0,x2:1,y2:0}}));
        add(st,'ellipse',{cx,cy:yt,rx:a,ry},'fill:'+tc(g.tn));
        add(st,'ellipse',{cx,cy:yt,rx:a,ry},'fill:#fff;fill-opacity:'+(0.18+GL*0.6));
        add(st,'ellipse',{cx,cy:yt+ry*0.18,rx:a*0.9,ry:ry*0.62},'fill:'+tc(g.tn)+';fill-opacity:.55');
      } else add(st,'polygon',{points:`${cx-a},${y0} ${cx+a},${y0} ${cx+b},${yb} ${cx-b},${yb}`},'fill:'+tc(g.tn));

  // ───────── growing-circles 커지는 원 ─────────
  // items[{label,sub,note,highlight}] 3~6 — 왼쪽 아래에서 오른쪽 위로 커진다. 마지막(또는 highlight)이 강조색

    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;

    N.forEach(q=>{ if(!q) return; x0=Math.min(x0,q.x0); x1=Math.max(x1,q.x1); y0=Math.min(y0,q.y0); y1=Math.max(y1,q.y1); });
    const ox=(W-(x1-x0))/2-x0, oy=14-y0, st=stage(y1-y0+28);
    if(d.axis){ const a=P[0], b=P[n-1], ux=Math.cos(ang), uy=-Math.sin(ang), off=rs[0]+34;   // 변화 방향 화살표(원 아래로 나란히)
      const sx=a[0]+ox+uy*-off, sy=a[1]+oy+ux*off; void sx; void sy; }
    P.forEach((p,i)=>{ const x=p[0]+ox, y=p[1]+oy, r=rs[i], op=hi[i]?1:(0.38+0.62*(n===1?1:i/(n-1))), tone=hi[i]?(d.highlight_tone||'wait'):tn;
      add(st,'circle',{cx:x,cy:y,r:r+5},'fill:#fff');

  // ───────── circle-chain 겹치는 원 사슬 ─────────

    const span=2*r+(n-1)*(2*r-ov), tot=(d.from?pw+ag:0)+span+(d.to?ag+pw:0), x0=(W-tot)/2+(d.from?pw+ag:0), top=d.head?40:16, cy=top+r+22;

  // ───────── ring-core 순환 고리와 핵심어 ─────────
  // core{title,sub}, left{tag,text}, right{tag,text}, panels[{num,title,items[],tone}] 0·2·4개 (왼위·오른위·왼아래·오른아래)
  function ringCore(d){

      if(o.tag){ const tx=left?edge-tw:edge; add(st,'rect',{x:tx,y:cy-22,width:tw,height:44,rx:22},'fill:'+tc('main')); lab(st,tx+tw/2,cy,0,[[o.tag,'sb']],{cls:'on'}); }

  }

  // ───────── ribbon-list 꼬리표 목록 ─────────

  // ───────── stat-strip 큰 숫자 묶음 ─────────

          if(GL>0) add(st,'rect',{x:x+pad,y,width:Math.max(6,tw*Math.min(1,m.share)),height:12,rx:6},'fill:'+grad(st,[[0,'#fff',GL*1.6],[1,'#fff',0]])); } y+=28; }

  // ═════════════════════════ 데이터 그래프 ═════════════════════════

  // ───────── bar-highlight 강조 막대 ─────────
  // items[{label,value,highlight,tone,note}], unit, orient:"h"|"v", ref{value,label}, decimals
  function barHighlight(d){
    const it=d.items.slice(), n=it.length, dec=d.decimals, vals=it.map(m=>m.value), lo=Math.min(0,...vals,(d.ref?d.ref.value:0)), hi=Math.max(0,...vals,(d.ref?d.ref.value:0));

      it.forEach((m,i)=>{ const y=top+i*rh, a=Math.min(zx,sc(m.value)), b=Math.max(zx,sc(m.value));
        add(st,'rect',{x:a,y:y+(rh-bh)/2,width:Math.max(2,b-a),height:bh,rx:SOLID?4:0},'fill:'+col(m));
        if(GL>0&&m.highlight) add(st,'rect',{x:a,y:y+(rh-bh)/2,width:Math.max(2,b-a),height:bh,rx:4},'fill:'+grad(st,[[0,'#fff',0],[1,'#fff',GL*1.4]],{attrs:{x1:0,y1:0,x2:1,y2:0}}));

  // x[], bars{label,unit,values[],tone}, line{label,unit,values[],tone}, highlight_x, decimals, line_decimals
  function barLine(d){
    const X=d.x, n=X.length, B=d.bars, L=d.line, bt=B.tone||'sub', lt=L.tone||'wait', H=d.height||520;

  // ───────── line-highlight 강조 선 ─────────

    const tk=niceTicks(d.zero===false?Math.min(...all):Math.min(0,...all),Math.max(...all),5), td=tickDec(tk), yw=Math.max(...tk.map(v=>measure(0,[[fmt(v,td),'vs']]).w))+14;

  // ───────── slope 기울기 ─────────

  // ───────── dumbbell 아령 · range-bar 범위 막대 ─────────

  // ───────── bubble-compare 비례 원 ─────────
  // items[{label,value,note,highlight,tone}] 2~6, unit, decimals — 넓이가 값에 비례, 바닥 맞춤

    const it=d.items, n=it.length, dec=d.decimals, mx=Math.max(...it.map(m=>m.value)), gap=d.gap||44;

    const noteH=Math.max(...it.map((m,i)=>measure(Math.max(2*r[i],minSlot)+gap-12,[[m.label,'h2'],[m.note,'s']]).h)), top=60, base=top+2*R, st=stage(base+18+noteH+10);
    add(st,'line',{x1:0,y1:base,x2:W,y2:base}).setAttribute('class','gr');

    if(d.unit){ const u=t('div','unit',/^\(/.test(d.unit)?d.unit:'(단위: '+d.unit+')'); root.insertBefore(u,st.el); }
  }

  // ───────── small-multiples 작은 그래프 묶음 ─────────

        add(st,'polyline',{points:pts.map(q=>q.join(',')).join(' ')},'fill:none;stroke:'+c+';stroke-width:'+(hot?5.5:4.5)+';stroke-linejoin:round;stroke-linecap:round');
        const e=pts[pts.length-1]; add(st,'circle',{cx:e[0],cy:e[1],r:8},'fill:'+c+';stroke:#fff;stroke-width:2.5'); lab(st,e[0]+12,e[1],0,[[fmt(last,dec),'v',c]],{anchor:'l'}); }
      lab(st,cx0,y0+8,0,[[X[0],'s']],{anchor:'tl'}); lab(st,bar?cx0+pw:x1,y0+8,0,[[X[n-1],'s']],{anchor:'tr'});

  // ───────── stacked-share 구성비 누적 막대 ─────────
  // series[{label,tone}], rows[{label,values[],highlight}], unit, decimals, normalize(기본 true) — 계열은 순서가 있는 한 색 계열로 칠한다
  function stackedShare(d){
    const S=d.series, rows=d.rows, n=rows.length, dec=d.decimals==null?0:d.decimals, norm=d.normalize!==false;
    const ramp=[['sub',''],['sub','line'],['mute','line'],['mute','tint'],['main','tint'],['main','']], onDark=[1,0,0,0,0,1];   // 한 색의 농도 단계 — 진한 칠은 첫 계열 하나

    const lw=Math.min(400,Math.max(...rows.map(r=>measure(0,[[r.label,r.highlight?'bb':'b']]).w))+20), sums=rows.map(r=>r.values.reduce((a,v)=>a+(v||0),0)), mx=Math.max(...sums);
    const tw=norm?0:Math.max(...sums.map(v=>measure(0,[[fmt(v,dec),'v']]).w))+14, rh=n<=5?70:n<=9?58:50, bh=Math.round(rh*0.64), x0=lw+10, x1=W-tw-4, st=stage(n*rh+8);
    rows.forEach((r,i)=>{ const y=4+i*rh+(rh-bh)/2, full=norm?(x1-x0):(x1-x0)*sums[i]/mx; let x=x0;
      lab(st,lw,y+bh/2,0,[[r.label,r.highlight?'bb':'b']],{anchor:'r'});
      r.values.forEach((v,j)=>{ if(!v) return; const w=full*v/sums[i]; add(st,'rect',{x,y,width:Math.max(1,w-2),height:bh},'fill:'+col(j));
        const txt=fmt(norm?v/sums[i]*100:v,dec); if(w>=measure(0,[[txt,'vs']]).w+14) lab(st,x+(w-2)/2,y+bh/2,0,[[txt,'vs',dark(j)?'#fff':'var(--ink)']]); x+=w; });
      if(GL>0) add(st,'rect',{x:x0,y,width:full,height:bh},'fill:'+grad(st,[[0,'#fff',GL*1.2],[1,'#fff',0]]));
      if(!norm) lab(st,x0+full+10,y+bh/2,0,[[fmt(sums[i],dec),'v']],{anchor:'l'});
      if(r.highlight) add(st,'rect',{x:x0-3,y:y-3,width:full+4,height:bh+6},'fill:none;stroke:'+tc('wait')+';stroke-width:4'); });
  }

  // ═════════════════════════ 유량·연결 (v2.3) ═════════════════════════
  // ───────── sankey 유량도 ─────────
  // nodes[{id,label,col,tone,highlight}], links[{from,to,value,highlight}], col_titles[], unit, decimals
  // 띠의 굵기가 값이다. 열 순서(col 0,1,2…)는 사양이 정하고, 열 안 순서는 nodes 에 적은 순서다
  function sankey(d){
    const N=d.nodes.map(n=>Object.assign({inL:[],outL:[]},n)), by={}, dec=d.decimals; N.forEach(n=>by[n.id]=n);
    const L=d.links.map(l=>({s:by[l.from],t:by[l.to],v:+l.value,hot:!!l.highlight,raw:l}));
    L.forEach(l=>{ if(!l.s||!l.t) throw new Error('links 의 from·to 가 nodes 의 id 에 없음: '+l.raw.from+' → '+l.raw.to); l.s.outL.push(l); l.t.inL.push(l); });
    const nc=Math.max(...N.map(n=>n.col||0))+1, cols=[]; for(let c=0;c<nc;c++) cols.push(N.filter(n=>(n.col||0)===c));
    N.forEach(n=>{ n.val=Math.max(n.inL.reduce((a,l)=>a+l.v,0),n.outL.reduce((a,l)=>a+l.v,0)); });
    unitLine(d.unit);
    const txt=n=>n.label+'  '+fmt(n.val,dec), gap=d.gap||18, bw=20, H0=d.height||520, top=d.col_titles?52:10;
    const lw=Math.max(...cols[0].map(n=>measure(0,[[txt(n),'b']]).w))+18, rw=Math.max(...cols[nc-1].map(n=>measure(0,[[txt(n),'b']]).w))+18;
    const k=Math.min(...cols.map(c=>(H0-gap*(c.length-1))/c.reduce((a,n)=>a+n.val,0))), st=stage(top+H0+12);
    const x0=lw, x1=W-rw-bw, cx=c=>nc===1?x0:x0+(x1-x0)*c/(nc-1), anyHot=L.some(l=>l.hot)||N.some(n=>n.highlight);
    cols.forEach((c,ci)=>{ const tot=c.reduce((a,n)=>a+n.val*k,0)+gap*(c.length-1); let y=top+(H0-tot)/2;

    N.forEach(n=>{ n.outL.sort((a,b)=>a.t.y-b.t.y); n.inL.sort((a,b)=>a.s.y-b.s.y);

    const tone=n=>n.tone||(n.highlight?'wait':'sub');
    L.slice().sort((a,b)=>(a.hot?1:0)-(b.hot?1:0)).forEach(l=>{ const t=Math.max(1.5,l.v*k), xa=l.s.x+bw, xb=l.t.x, mx=(xa+xb)/2;
      const hot=l.hot||l.s.highlight||l.t.highlight, col=anyHot?(hot?tc(l.raw.tone||(l.s.highlight?tone(l.s):(l.t.highlight?tone(l.t):'wait'))):'var(--tone-mute-line)'):tc(tone(l.s));
      add(st,'path',{d:`M${xa} ${l.y0} C ${mx} ${l.y0}, ${mx} ${l.y1}, ${xb} ${l.y1} L ${xb} ${l.y1+t} C ${mx} ${l.y1+t}, ${mx} ${l.y0+t}, ${xa} ${l.y0+t} Z`},'fill:'+col+';fill-opacity:'+(anyHot?(hot?0.62:0.38):0.34)); });
    N.forEach(n=>{ add(st,'rect',{x:n.x,y:n.y,width:bw,height:n.h,rx:SOLID?3:0},'fill:'+tc(tone(n)));
      if(GL>0) add(st,'rect',{x:n.x,y:n.y,width:bw,height:n.h,rx:3},'fill:'+grad(st,[[0,'#fff',GL*1.4],[1,'#fff',0]],{attrs:{x1:0,y1:0,x2:1,y2:0}})); });
    cols.forEach((c,ci)=>{ const first=ci===0, ys=spread(c.map(n=>n.y+n.h/2),34,top+14,top+H0-4);
      c.forEach((n,i)=>{ const hot=n.highlight, mid=(ci>0&&ci<nc-1); lab(st,first?n.x-12:n.x+bw+12,ys[i],0,[[n.label,hot?'bb':'b',(hot&&!mid)?tc(tone(n)):null]],{anchor:first?'r':'l',cls:(ci>0&&ci<nc-1)?'halo':''}).firstChild.append(Object.assign(document.createElement('span'),{textContent:'  '+fmt(n.val,dec),className:'vs'})); });
      if(d.col_titles&&d.col_titles[ci]) lab(st,first?c[0].x+bw:(ci===nc-1?c[0].x:c[0].x+bw/2),8,0,[[d.col_titles[ci],'sb']],{anchor:first?'tr':(ci===nc-1?'tl':'t')}); });
  }

  // ───────── link-map 연결도 (열 사이 연결) ─────────
  // columns[{title,tone,items[{id,label,tone,highlight}]}] 2~3열, links[{from,to,highlight}]
  // 선 굵기는 모두 같다 — 무엇이 무엇에 닿는지만 말한다(양은 말하지 않는다)
  function linkMap(d){
    const C=d.columns, nc=C.length, by={}, gapY=12, top=C.some(c=>c.title)?54:8;
    const few=c=>c.items.length<=5, cw=C.map(c=>c.width||(few(c)?250:Math.min(420,(W-2*250-2*150)))), free=W-cw.reduce((a,b)=>a+b,0), gx=nc>1?free/(nc-1):0;
    let x=0; C.forEach((c,ci)=>{ c._x=x; c._w=cw[ci]; x+=cw[ci]+gx; });
    C.forEach(c=>c.items.forEach(m=>{ m._h=Math.max(few(c)?86:50,measure(c._w-28,[[m.label,few(c)?'h2':'bb']]).h+(few(c)?30:18)); }));
    const colH=c=>c.items.reduce((a,m)=>a+m._h,0)+gapY*(c.items.length-1), H0=Math.max(...C.map(colH));
    C.forEach(c=>{ if(few(c)&&colH(c)<H0){ const extra=(H0-colH(c))/c.items.length, grow=Math.min(extra,70); c.items.forEach(m=>m._h+=grow); c._gap=(H0-c.items.reduce((a,m)=>a+m._h,0))/Math.max(1,c.items.length-1); } else c._gap=gapY; });
    const st=stage(top+H0+10);
    C.forEach((c,ci)=>{ const tot=c.items.reduce((a,m)=>a+m._h,0)+c._gap*(c.items.length-1); let y=top+(H0-tot)/2;
      if(c.title) lab(st,c._x+c._w/2,8,c._w,[[c.title,'sb']],{anchor:'t'});
      c.items.forEach((m,i)=>{ m._c=c; m._ci=ci; m._y=y; m._tone=m.tone||c.tone||(few(c)?['go','main','wait','sub','mute'][i%5]:'sub'); m._big=few(c); m._solid=few(c)&&(c.fill?c.fill==='solid':ci===0); by[m.id]=m; y+=m._h+c._gap; }); });
    const anyHot=d.links.some(l=>l.highlight)||C.some(c=>c.items.some(m=>m.highlight));
    const LK=d.links.map(l=>{ const a=by[l.from], b=by[l.to]; if(!a||!b) throw new Error('links 의 from·to 가 items 의 id 에 없음: '+l.from+' → '+l.to); return {a,b,hot:!!(l.highlight||a.highlight||b.highlight),raw:l}; });
    const outN={}, inN={}, outI={}, inI={}; LK.forEach(l=>{ outN[l.a.id]=(outN[l.a.id]||0)+1; inN[l.b.id]=(inN[l.b.id]||0)+1; });
    LK.slice().sort((p,q)=>(p.a._y-q.a._y)||(p.b._y-q.b._y)).forEach(l=>{ l.oi=outI[l.a.id]=(outI[l.a.id]||0)+1; });
    LK.slice().sort((p,q)=>(p.b._y-q.b._y)||(p.a._y-q.a._y)).forEach(l=>{ l.ii=inI[l.b.id]=(inI[l.b.id]||0)+1; });
    LK.slice().sort((p,q)=>(p.hot?1:0)-(q.hot?1:0)).forEach(l=>{ const a=l.a, b=l.b, xa=a._c._x+a._c._w, xb=b._c._x-13;
      const ya=a._y+a._h*(l.oi/(outN[a.id]+1)), yb=b._y+b._h*(l.ii/(inN[b.id]+1)), mx=(xa+xb)/2;
      const col=(anyHot&&!l.hot)?'var(--tone-mute-line)':tc(l.raw.tone||(a._big?a._tone:b._tone));
      add(st,'path',{d:`M${xa} ${ya} C ${mx} ${ya}, ${mx} ${yb}, ${xb} ${yb}`},'fill:none;stroke:'+col+';stroke-width:'+(l.hot?5:4)+';stroke-linecap:round;opacity:'+((anyHot&&!l.hot)?0.7:0.9));
      add(st,'polygon',{points:`${xb-2},${yb-8} ${xb+13},${yb} ${xb-2},${yb+8}`},'fill:'+col); });
    C.forEach(c=>c.items.forEach(m=>{ const hot=m.highlight;
      if(m._solid){ add(st,'rect',{x:c._x,y:m._y,width:c._w,height:m._h,rx:SOLID?8:0},'fill:'+tc(m._tone));
        if(GL>0) add(st,'rect',{x:c._x,y:m._y,width:c._w,height:m._h,rx:8},'fill:'+grad(st,[[0,'#fff',GL*1.3],[1,'#000',GL*0.5]]));
        lab(st,c._x+c._w/2,m._y+m._h/2,c._w-28,[[m.label,'h2']],{cls:'on',fit:[c._w-8,m._h-4]});
      } else { add(st,'rect',{x:c._x,y:m._y,width:c._w,height:m._h,rx:SOLID?6:0},'fill:'+tc(m._tone,'tint')+';stroke:'+tc(m._tone,(hot||m._big)?'':'line')+';stroke-width:'+(hot?3:(m._big?2.5:1.5)));
        lab(st,c._x+c._w/2,m._y+m._h/2,c._w-28,[[m.label,m._big?'h2':'bb',m._big?tc(m._tone):null]],{fit:[c._w-8,m._h-2]}); } }));
  }

  // ───────── network 연결망 ─────────
  // nodes[{id,label,value,group,tone,highlight}] 5~16, links[{from,to,weight}], groups[{key,label,tone}], center:"id"
  // 마디를 타원 위에 두고(가운데 하나를 둘 수 있다) 연결을 안쪽 곡선으로 잇는다. 원 크기=value, 선 굵기=weight
  function network(d){
    const N=d.nodes.map(n=>Object.assign({},n)), by={}; N.forEach(n=>by[n.id]=n);
    const G={}; (d.groups||[]).forEach(g=>G[g.key||g.label]=g);
    if(d.groups) legend(d.groups.map(g=>({label:g.label,color:tc(g.tone||'sub'),shape:'dot'})));
    const ctr=d.center?by[d.center]:null, ring=N.filter(n=>n!==ctr), n=ring.length, vmax=Math.max(...N.map(m=>m.value||1)), wmax=Math.max(...d.links.map(l=>l.weight||1));
    const rOf=m=>(d.r_min||14)+((d.r_max||40)-(d.r_min||14))*Math.sqrt((m.value||1)/vmax), tone=m=>m.tone||(G[m.group]&&G[m.group].tone)||(m.highlight?'wait':'sub');
    const lblW=Math.min(330,Math.max(...ring.map(m=>measure(0,[[m.label,'b']]).w))+8), rx=d.rx||Math.min(470,W/2-lblW-52), ry=d.ry||260, padY=Math.max(76,Math.max(...ring.map(rOf))+58), cx=W/2, cy=padY+ry, st=stage(2*ry+2*padY);
    ring.forEach((m,i)=>{ const a=rad(-90+360*i/n+(d.rotate||0)); m.a=a; m.x=cx+rx*Math.cos(a); m.y=cy+ry*Math.sin(a); m.r=rOf(m); });
    if(ctr){ ctr.x=cx; ctr.y=cy; ctr.r=Math.max(rOf(ctr),d.center_r||46); }
    const hotIds=new Set(N.filter(m=>m.highlight).map(m=>m.id)), anyHot=hotIds.size>0||d.links.some(l=>l.highlight);
    const LK=d.links.map(l=>{ const a=by[l.from], b=by[l.to]; if(!a||!b) throw new Error('links 의 from·to 가 nodes 의 id 에 없음: '+l.from+' → '+l.to);
      return {a,b,w:(l.weight||1)/wmax,hot:!!(l.highlight||hotIds.has(a.id)||hotIds.has(b.id)),raw:l}; });
    LK.sort((p,q)=>(p.hot?1:0)-(q.hot?1:0)||p.w-q.w).forEach(l=>{ const a=l.a, b=l.b, mxp=(a.x+b.x)/2, myp=(a.y+b.y)/2, pull=(a===ctr||b===ctr)?0:0.5;
      const qx=mxp+(cx-mxp)*pull, qy=myp+(cy-myp)*pull, hn=hotIds.has(a.id)?a:(hotIds.has(b.id)?b:null);
      const col=l.hot?tc(l.raw.tone||(hn?tone(hn):'wait')):'var(--tone-mute-line)';
      add(st,'path',{d:`M${a.x} ${a.y} Q ${qx} ${qy} ${b.x} ${b.y}`},'fill:none;stroke:'+col+';stroke-linecap:round;stroke-width:'+(1.5+6.5*l.w).toFixed(1)+';opacity:'+(l.hot?0.88:(anyHot?0.72:0.5+0.4*l.w)).toFixed(2)); });
    N.forEach(m=>{ add(st,'circle',{cx:m.x,cy:m.y,r:m.r+3},'fill:#fff'); add(st,'circle',{cx:m.x,cy:m.y,r:m.r},'fill:'+tc(tone(m)));
      if(GL>0) add(st,'circle',{cx:m.x,cy:m.y,r:m.r},'fill:'+grad(st,[[0,'#fff',GL*1.8],[0.75,'#fff',0]],{radial:1,attrs:{cx:0.35,cy:0.3,r:0.8}})); });
    ring.forEach(m=>{ const c=Math.cos(m.a), s=Math.sin(m.a), o=m.r+12, hot=m.highlight;
      const an=Math.abs(c)<0.2?(s<0?'b':'t'):(c>0?'l':'r');
      lab(st,m.x+c*o,m.y+s*o,0,[[m.label,hot?'bb':'b',hot?tc(tone(m)):null]],{anchor:an,align:an==='l'?'l':(an==='r'?'r':null)}); });
    if(ctr){ const w=measure(0,[[ctr.label,'h2']]).w; if(w<=ctr.r*1.7) lab(st,cx,cy,ctr.r*1.8,[[ctr.label,'h2']],{cls:'on',fit:[ctr.r*2,ctr.r*2]});
      else lab(st,cx,cy+ctr.r+10,0,[[ctr.label,'h2',tc(tone(ctr))]],{anchor:'t',cls:'halo'}); }
  }

  // ═════════════════════════ 기존 도식 형태의 새 디자인 (v2.3) ═════════════════════════
  // forms.html 과 같은 사양(data 키)을 그대로 받아 새 디자인으로 그린다 — 구조는 그대로, 생김새만 바꾼다.
  // ───────── pyramid 위계 ─────────  levels[{title,desc,tone,highlight}] 위→아래
  function pyramidX(d){
    const lv=d.levels, m=lv.length, gap=7, T=8, BW=d.base_width||640, TW=Math.max(170,BW*0.24), cx=BW/2+34, descX=cx+BW/2+70, descW=W-descX-8;
    const ramp=[['main',''],['sub',''],['go',''],['go','line'],['mute','line']], pick=i=>ramp[Math.min(ramp.length-1,Math.round(i*(Math.min(m,5)-1)/Math.max(1,m-1)))];
    const hs=lv.map(v=>Math.max(m<=4?104:88,measure(descW,[[v.desc,'b']],{align:'l'}).h+30)), H=T+hs.reduce((a,b)=>a+b,0)+gap*(m-1)+10, st=stage(H);
    const tot=H-T-10, wAt=y=>TW+(BW-TW)*((y-T)/tot); let y=T;
    lv.forEach((v,i)=>{ const y0=y, y1=y+hs[i], a=wAt(y0)/2, b=wAt(y1)/2, p=v.highlight?['wait','']:(v.tone?[v.tone,'']:pick(i)), col=tc(p[0],p[1]), dark=p[1]!=='line';
      add(st,'rect',{x:cx-BW/2-34,y:y0,width:W-(cx-BW/2-34),height:hs[i],rx:SOLID?8:0},'fill:'+tc(p[0],'tint')+';fill-opacity:'+(i%2?0.55:1));
      const pts=`${cx-a},${y0} ${cx+a},${y0} ${cx+b},${y1} ${cx-b},${y1}`;
      add(st,'polygon',{points:pts},'fill:'+col);
      if(GL>0) add(st,'polygon',{points:pts},'fill:'+grad(st,[[0,'#000',GL*0.5],[0.35,'#fff',GL*1.1],[0.7,'#fff',0],[1,'#000',GL*0.9]],{attrs:{x1:0,y1:0,x2:1,y2:0}}));
      lab(st,cx,(y0+y1)/2,2*a-28,[[v.title,'h2',dark?null:tc('main')]],{cls:dark?'on':'',fit:[a+b-8,hs[i]-4]});
      if(v.desc){ add(st,'path',{d:`M${cx+(a+b)/2+14} ${(y0+y1)/2} L${descX-16} ${(y0+y1)/2}`},'stroke:'+tc(p[0],'line')+';stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none');
        lab(st,descX,(y0+y1)/2,descW,[[v.desc,'b']],{anchor:'l',align:'l'}); }
      y=y1+gap; });
  }

  // ───────── venn 교집합 ─────────  sets[{title,desc,tone}] 2~3, overlaps{"12","13","23","123"}
  function vennX(d){
    const s=d.sets, n=s.length, o=d.overlaps||{}, tn=i=>s[i].tone||['main','go','wait'][i], H=n===2?560:690, st=stage(H);
    const ring=(x,y,r,i)=>{ add(st,'circle',{cx:x,cy:y,r},'fill:'+tc(tn(i))+';fill-opacity:.2;stroke:'+tc(tn(i))+';stroke-width:4');
      if(GL>0) add(st,'circle',{cx:x,cy:y,r:r-2},'fill:'+grad(st,[[0,'#fff',GL*2.2],[0.7,'#fff',0]],{radial:1,attrs:{cx:0.36,cy:0.28,r:0.85}})); };
    const chip=(x,y,txt,strong)=>{ const mz=measure(strong?170:190,[[txt,strong?'h2':'bb']]), w=mz.w+30, h=mz.h+16;
      add(st,'rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:Math.min(h/2,22)},strong?('fill:'+tc('main')):'fill:#fff;fill-opacity:.92;stroke:var(--neutral-line);stroke-width:1.5');
      lab(st,x,y,strong?170:190,[[txt,strong?'h2':'bb']],{cls:strong?'on':''}); };
    if(n===2){ const r=228, c=[[W/2-150,280],[W/2+150,280]]; c.forEach((p,i)=>ring(p[0],p[1],r,i));
      [[c[0][0]-r*0.42,0],[c[1][0]+r*0.42,1]].forEach(([x,i])=>lab(st,x,280,230,[[s[i].title,'h1',tc(tn(i))],[s[i].desc,'b']]));
      if(o['12']) chip(W/2,280,o['12'],true);
    } else { const r=214, dd=136, C=[W/2,372], dir=[-90,150,30].map(a=>[Math.cos(rad(a)),Math.sin(rad(a))]), c=dir.map(v=>[C[0]+v[0]*dd,C[1]+v[1]*dd]);
      c.forEach((p,i)=>ring(p[0],p[1],r,i));
      dir.forEach((v,i)=>lab(st,C[0]+v[0]*(dd+r*0.5),C[1]+v[1]*(dd+r*0.5),220,[[s[i].title,'h1',tc(tn(i))],[s[i].desc,'b']]));
      [['12',0,1],['13',0,2],['23',1,2]].forEach(([k,a,b])=>{ if(!o[k]) return; const vx=dir[a][0]+dir[b][0], vy=dir[a][1]+dir[b][1], L=Math.hypot(vx,vy); chip(C[0]+vx/L*dd*1.1,C[1]+vy/L*dd*1.1,o[k],false); });
      if(o['123']) chip(C[0],C[1],o['123'],true); }
  }

  // ───────── cycle 순환 ─────────  items[{title,desc,highlight,tone}] 3~8, center{title,desc}, numbered
  function cycleX(d){
    const it=d.items, n=it.length, R=d.r||178, rw=54, Ro=R+rw/2, Ri=R-rw/2, lw=d.label_w||330, padY=96, cx=W/2, cy=padY+Ro, st=stage(2*Ro+2*padY);
    const seq=['go','sub','main'], step=360/n, gapA=3.2, tip=Math.min(11,step*0.2), P=(a,r)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
    it.forEach((m,i)=>{ const a0=-90+step*i+gapA/2-step/2-tip/2, a1=a0+step-gapA, tn=m.highlight?'wait':(m.tone||seq[i%3]), big=(a1-a0)>180?1:0;
      const o0=P(a0,Ro), o1=P(a1,Ro), t1=P(a1+tip,R), i1=P(a1,Ri), i0=P(a0,Ri), n0=P(a0+tip,R);
      const p=`M${o0[0]} ${o0[1]} A ${Ro} ${Ro} 0 ${big} 1 ${o1[0]} ${o1[1]} L ${t1[0]} ${t1[1]} L ${i1[0]} ${i1[1]} A ${Ri} ${Ri} 0 ${big} 0 ${i0[0]} ${i0[1]} L ${n0[0]} ${n0[1]} Z`;
      add(st,'path',{d:p},'fill:'+tc(tn));
      if(GL>0) add(st,'path',{d:p},'fill:'+grad(st,[[0,'#fff',GL*1.3],[1,'#000',GL*0.5]]));
      const am=-90+step*i, c=Math.cos(rad(am)), s=Math.sin(rad(am));
      if(d.numbered){ const q=P(am,R); add(st,'circle',{cx:q[0],cy:q[1],r:19},'fill:#fff'); lab(st,q[0],q[1],0,[[String(i+1),'h2',tc(tn)]]); }
      const an=Math.abs(c)<0.25?(s<0?'b':'t'):((s>0.3?'t':(s<-0.3?'b':''))+(c>0?'l':'r')), q=P(am,Ro+(Math.abs(c)<0.25?20:10));
      lab(st,q[0],q[1],an==='b'||an==='t'?lw+60:lw,[[m.title,'h2',tc(tn)],[m.desc,'b']],{anchor:an,align:/l$/.test(an)?'l':(/r$/.test(an)?'r':null)}); });
    if(d.center){ add(st,'circle',{cx,cy,r:Ri-16},'fill:var(--fill-faint);stroke:var(--line-soft);stroke-width:2');
      lab(st,cx,cy,2*(Ri-16)-30,[[d.center.title,'h1'],[d.center.desc,'b']],{fit:[2*(Ri-16)-8,2*(Ri-16)-30]}); }
  }

  // ── 공용: 둥근 카드·머리띠·점선 지시선·광택 ──
  function gloss(st,tag,a,k){ if(GL>0) add(st,tag,a,'fill:'+grad(st,[[0,'#fff',GL*(k||1.3)],[1,'#000',GL*0.45]])); }
  function card(st,x,y,w,h,tn,o){ o=o||{}; const r=SOLID?(o.r==null?10:o.r):0;
    add(st,'rect',{x,y,width:w,height:h,rx:r},o.solid?('fill:'+tc(tn)):('fill:'+(o.white?'var(--card-fill)':tc(tn,'tint'))+';stroke:'+tc(tn,o.strong?'':'line')+';stroke-width:'+(o.strong?3:2)));
    if(o.solid) gloss(st,'rect',{x,y,width:w,height:h,rx:r}); }

      add(st,'polygon',{points:`${ax1-14},14 ${ax1},22 ${ax1-14},30`},'fill:'+tc('mute')); lab(st,(ax0+ax1)/2,22,0,[[d.top_arrow.label,'bb',tc('mute')]]); }
    C.forEach((c,i)=>{ const x=i?jx(i-1):xb, w=i?cw:base; add(st,'rect',{x,y:top,width:w,height:hh,rx:SOLID?10:0},i?('fill:'+tc('main')):('fill:'+tc('mute','line'))); if(i) gloss(st,'rect',{x,y:top,width:w,height:hh,rx:10},1.1);

  // ───────── decision-flow ─────────  gates[{num,name,count,principles[{id,text}],fail}], final, legend[{text,_kind}]

  // ───────── timeline-gantt ─────────  columns[], stages[{badge,label,bar_label,start,end,gate}], top_note, milestones[{label,date,col}],
  //                                     deliverable_boxes[{text,from_col,to_col}], cumulative, footer{dept_label,dept_value,dept_list,donut_pct,donut_headline,donut_sub}
  function timelineGanttX(d){
    const C=d.columns, nc=C.length, S=d.stages, lw=258, x0=lw+16, cum=d.cumulative?150:0, x1=W-cum-(cum?16:0), cw=(x1-x0)/nc, cx=c=>x0+cw*c, top=d.top_note?52:6, hh=50, rh=80;

      add(st,'rect',{x:bx,y:y+15,width:bx2-bx,height:rh-30,rx:SOLID?12:0},'fill:'+tc(tn)); gloss(st,'rect',{x:bx,y:y+15,width:bx2-bx,height:rh-30,rx:12},1.2);

      add(st,'polygon',{points:`${mx},${msY-2} ${mx+13},${msY+11} ${mx},${msY+24} ${mx-13},${msY+11}`},'fill:'+tc('main')); lab(st,mx+(an==='tl'?20:(an==='tr'?-20:0)),msY+(an==='t'?28:-2),0,[[m.label+'  '+(m.date||''),'bb',tc('main')]],{anchor:an==='t'?'t':an}); });
    (d.deliverable_boxes||[]).forEach(b=>{ const xa=cx(b.from_col)+5, xb=(b.to_col>=nc-1?x1:cx(b.to_col))-5; card(st,xa,dbY,xb-xa,dbH-8,'go',{strong:1}); lab(st,(xa+xb)/2,dbY+(dbH-8)/2,xb-xa-24,[[flat(b.text),'bb',tc('go')]],{fit:[xb-xa,dbH-8]}); });

    if(ft){ add(st,'rect',{x:0,y:fY,width:W,height:fH,rx:SOLID?12:0},'fill:var(--fill-faint);stroke:var(--line-soft);stroke-width:1.5');
      const pw=measure(0,[[ft.dept_label,'sb']]).w+34; pillBox(st,22,fY+20,pw,42,'sub',true); lab(st,22+pw/2,fY+41,0,[[ft.dept_label,'sb']],{cls:'on'});

      if(ft.donut_pct!=null){ const dx=W*0.64, dy=fY+fH/2, r=44, c=2*Math.PI*r; add(st,'circle',{cx:dx,cy:dy,r},'fill:none;stroke:'+tc('wait','tint')+';stroke-width:16');
        add(st,'circle',{cx:dx,cy:dy,r,transform:`rotate(-90 ${dx} ${dy})`},'fill:none;stroke:'+tc('wait')+';stroke-width:16;stroke-dasharray:'+(c*ft.donut_pct/100).toFixed(1)+' '+c.toFixed(1));
        lab(st,dx,dy,0,[[ft.donut_pct+'%','bb',tc('wait')]]); lab(st,dx+r+28,dy,W-dx-r-40,[[ft.donut_headline,'h2'],[ft.donut_sub,'s']],{anchor:'l',align:'l'}); } }

  // ───────── timeline-tracks ─────────  axis{start,end,step}, tracks[{name,_tone,nodes[{at,to,year,label,_lane,_align,_w}]}]
  function timelineTracksX(d){
    const A=d.axis, T=d.tracks, lw=156, x0=lw+34, x1=W-34, sx=v=>x0+(v-A.start)/(A.end-A.start)*(x1-x0), tones=['main','main','go','sub','wait']; let y=6; const L=[];
    T.forEach(t_=>{ const lanes=Math.max(...t_.nodes.map(n=>n._lane||0))+1, ch=Math.max(...t_.nodes.map(n=>measure(Math.max(n._w||240,270)-28,[[n.year,'bb'],[n.label,'b']],{align:'l'}).h))+20, laneH=ch+12, h=lanes*laneH+52; L.push({t_,y,h,ch,laneH}); y+=h+12; });
    const st=stage(y+44), step=A.step||1, every=((A.end-A.start)/step>14)?2:1;
    for(let v=A.start,k=0;v<=A.end+1e-9;v+=step,k++){ add(st,'path',{d:`M${sx(v)} 6 L${sx(v)} ${y}`},'stroke:var(--grid-line);stroke-width:1.5;stroke-dasharray:4 6;fill:none'); if(k%every===0) lab(st,sx(v),y+8,0,[[String(v),'b']],{anchor:'t'}); }
    add(st,'path',{d:`M${x0-10} ${y} L${x1+10} ${y}`},'stroke:var(--ink-soft);stroke-width:2;fill:none');
    L.forEach(o=>{ const t_=o.t_, tn=tones[Math.min(4,t_._tone||1)], by=o.y+o.h-24; add(st,'rect',{x:0,y:o.y,width:W,height:o.h,rx:SOLID?10:0},'fill:'+tc(tn,'tint')+';fill-opacity:.55');
      add(st,'rect',{x:0,y:o.y,width:lw,height:o.h,rx:SOLID?10:0},'fill:'+tc(tn)); gloss(st,'rect',{x:0,y:o.y,width:lw,height:o.h,rx:10},1.1); lab(st,lw/2,o.y+o.h/2,lw-20,[[t_.name,'h2']],{cls:'on',fit:[lw-6,o.h-6]});
      add(st,'path',{d:`M${x0-10} ${by} L${x1+10} ${by}`},'stroke:'+tc(tn,'line')+';stroke-width:5;stroke-linecap:round;fill:none');
      t_.nodes.forEach(n=>{ const xa=sx(n.at), xb=n.to!=null?sx(n.to):xa, w=Math.max(n._w||240,270), al=n._align||'center', mid=(xa+xb)/2, lane=n._lane||0;
        let cx_=al==='start'?xa-14:(al==='end'?xb+14-w:mid-w/2); cx_=Math.max(lw+10,Math.min(W-w-2,cx_)); const cy_=by-22-o.ch-lane*o.laneH;
        add(st,'path',{d:`M${mid} ${by} L${mid} ${cy_+o.ch}`},'stroke:'+tc(tn)+';stroke-width:2.5;fill:none');
        if(n.to!=null) add(st,'path',{d:`M${xa} ${by} L${xb} ${by}`},'stroke:'+tc(tn)+';stroke-width:13;stroke-linecap:round;fill:none'); else { add(st,'circle',{cx:xa,cy:by,r:11},'fill:'+tc(tn)+';stroke:#fff;stroke-width:3'); }
        card(st,cx_,cy_,w,o.ch,tn,{white:1}); lab(st,cx_+14,cy_+o.ch/2,w-28,[[n.year,'bb',tc(tn)],[n.label,'b']],{anchor:'l',align:'l',fit:[w-4,o.ch]}); }); });
  }

  // ───────── pipe-mapping ─────────  segments[], rows[{lane,blocks[{label,_inlet,_from,_to,_node,_lw,_lane}],nodes[],note}]
  function pipeMappingX(d){
    const SG=d.segments, ns=SG.length, lw=178, px0=lw+22, pw=540, gut=92, nx=px0+pw+gut, nw=W-nx, sw=pw/ns, top=58, R=[]; let y=top;
    d.rows.forEach(r=>{ const nh=r.nodes.map(t_=>Math.max(60,measure(nw-36,[[t_,'b']],{align:'l'}).h+24)), nodesH=sum(nh)+10*(nh.length-1), lanes=Math.max(0,...r.blocks.map(b=>b._lane||0))+1;
      const lh=Math.max(...r.blocks.map(b=>measure(b._lw||210,[[b.label,'sb']]).h))+10, noteH=r.note?measure(pw+gut-30,[[r.note,'s']],{align:'l'}).h+10:0, h=Math.max(nodesH,34+lanes*lh+12+noteH)+28; R.push({r,y,h,nh,lh,noteH}); y+=h+10; });
    const st=stage(y);
    SG.forEach((s,j)=>{ pillBox(st,px0+j*sw+4,6,sw-8,42,'sub',false); lab(st,px0+(j+0.5)*sw,27,0,[[s,'bb',tc('sub')]]); });
    R.forEach((o,ri)=>{ const r=o.r, py=o.y+14; add(st,'rect',{x:0,y:o.y,width:W,height:o.h,rx:SOLID?10:0},'fill:'+(ri%2?'var(--card-fill)':'var(--fill-faint)')+';stroke:var(--line-soft);stroke-width:1.5');
      add(st,'rect',{x:0,y:o.y,width:lw,height:o.h,rx:SOLID?10:0},'fill:'+tc('main')); gloss(st,'rect',{x:0,y:o.y,width:lw,height:o.h,rx:10},1.1); lab(st,lw/2,o.y+o.h/2,lw-20,[[r.lane,'h2']],{cls:'on',fit:[lw-6,o.h-6]});
      add(st,'rect',{x:px0,y:py,width:pw,height:26,rx:SOLID?13:0},'fill:'+tc('mute','tint')+';stroke:'+tc('mute','line')+';stroke-width:1.5');
      for(let j=1;j<ns;j++) add(st,'path',{d:`M${px0+j*sw} ${py+3} L${px0+j*sw} ${py+23}`},'stroke:'+tc('mute','line')+';stroke-width:2;fill:none');

        if(b._inlet) add(st,'circle',{cx:px0,cy:py+13,r:17},'fill:'+tc('stop')+';stroke:#fff;stroke-width:3'); else add(st,'rect',{x:xa+3,y:py,width:xb-xa-6,height:26,rx:SOLID?13:0},'fill:'+tc('stop'));
        const lx=Math.max(px0-10,Math.min(px0+pw+gut-24-w,mx-w/2)); add(st,'path',{d:`M${mx} ${py+28} L${mx} ${ly+4}`},'stroke:'+tc('stop')+';stroke-width:2.5;fill:none');
        const e=lab(st,lx,ly+6,w,[[b.label,'sb',tc('stop')]],{anchor:'tl',cls:'halo'}); void e;
        if(b._node!=null&&nyc[b._node]!=null){ const sy_=ly+6+(o.lh-10)/2, sxx=Math.min(px0+pw+gut-22,lx+w+6); add(st,'path',{d:`M${sxx} ${sy_} C ${(sxx+nx)/2+10} ${sy_}, ${(sxx+nx)/2-10} ${nyc[b._node]}, ${nx-14} ${nyc[b._node]}`},'stroke:'+tc('go')+';stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round;fill:none');
          add(st,'polygon',{points:`${nx-14},${nyc[b._node]-7} ${nx-2},${nyc[b._node]} ${nx-14},${nyc[b._node]+7}`},'fill:'+tc('go')); } });
      if(r.note) lab(st,px0,o.y+o.h-12,pw+gut-30,[[r.note,'s']],{anchor:'bl',align:'l'}); });
