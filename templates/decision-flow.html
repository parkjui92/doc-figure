<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
/*__STYLE_TOKENS__*/
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; }
#figure { width:1500px; word-break:var(--word-break); display:var(--fig-display); flex-direction:column; background:var(--bg); font-family:var(--font); color:var(--ink);
  padding:34px 40px 28px; -webkit-font-smoothing:antialiased; }
.hd { text-align:var(--title-align); border-bottom:var(--title-under); padding-bottom:var(--title-under-gap); margin-bottom:20px; }
.hd h1 { font-size:calc(34px * var(--title-scale)); font-family:var(--font-title); font-weight:var(--w-title); color:var(--title-ink); letter-spacing:var(--title-track); }

.grow { display:flex; align-items:center; }
.gate { flex:0 0 auto; border:3px solid var(--navy-deep); border-radius:var(--radius-box);
  background:var(--card-fill); padding:14px 20px 16px; text-align:center; box-shadow:var(--shadow); }
.gate .g1 { display:inline-block; background:var(--strong-fill); color:var(--strong-ink); box-shadow:var(--strong-ring); font-size:calc(17px * var(--text-scale));
  font-weight:var(--w-title); padding:4px 16px; border-radius:var(--radius-pill); letter-spacing:.5px; }
.gate .g2 { margin-top:9px; font-size:calc(21px * var(--text-scale)); font-weight:var(--w-title); color:var(--navy-deep); line-height:1.3; }
.gate .g3 { display:inline-block; margin-top:8px; background:var(--bar-fill); color:var(--navy-mid);
  font-size:calc(16px * var(--text-scale)); font-weight:var(--w-strong); padding:3px 14px; border-radius:var(--radius-pill);
  border:1px solid var(--bar-border); }
.pgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:13px; }
.pgrid .p { background:var(--bar-fill); border:1.5px solid var(--bar-border); border-radius:max(0px, calc(var(--radius-box) - 4px));
  padding:8px 6px; display:flex; align-items:center; justify-content:center; gap:8px; }
.pgrid .p .pn { font-size:calc(15px * var(--text-scale)); font-weight:var(--w-title); color:#fff; background:var(--navy-mid);
  border-radius:max(0px, calc(var(--radius-box) - 6px)); padding:2px 7px; }
.pgrid .p .pt { font-size:calc(17px * var(--text-scale)); font-weight:var(--w-strong); color:var(--navy-deep); }

.br { flex:0 0 auto; position:relative; height:40px; }
.br::before { content:""; position:absolute; left:2px; right:20px; top:50%;
  border-top:3px dashed var(--accent); }
.br::after { content:""; position:absolute; right:2px; top:50%; transform:translateY(-50%);
  border-left:18px solid var(--accent); border-top:9px solid transparent; border-bottom:9px solid transparent; }
.act { flex:0 0 auto; white-space:pre-line; border:2.5px var(--accent-line) var(--accent); background:var(--accent-fill);
  border-radius:max(0px, calc(var(--radius-box) - 2px)); padding:12px 16px; font-size:calc(18px * var(--text-scale)); font-weight:var(--w-strong);
  color:var(--accent); line-height:1.3; }

.down { position:relative; }
.down::before { content:""; position:absolute; left:50%; top:0; transform:translateX(-50%);
  width:4px; height:calc(100% - 12px); background:var(--navy-deep); }
.down::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  border-top:14px solid var(--navy-deep); border-left:11px solid transparent; border-right:11px solid transparent; }

.final { background:var(--strong-fill); color:var(--strong-ink); border-radius:var(--radius-box); text-align:center;
  padding:18px; font-size:calc(25px * var(--text-scale)); font-weight:var(--w-title); letter-spacing:1px; box-shadow:var(--strong-ring), var(--shadow); }

.legend { display:flex; justify-content:flex-end; gap:30px; margin-top:22px; padding-top:14px;
  border-top:1.5px solid var(--grid-line); }
.legend .li { display:flex; align-items:center; gap:10px; font-size:calc(17px * var(--text-scale)); font-weight:var(--w-label); color:var(--ink); }
.legend .ln { width:46px; height:0; }
.legend .ln.pass { border-top:3px solid var(--navy-deep); }
.legend .ln.fail { border-top:3px dashed var(--accent); }
.caption { order:var(--caption-order); text-align:var(--caption-align); margin-top:calc(20px * var(--caption-mt)); margin-bottom:var(--caption-mb); font-size:var(--caption-size); font-weight:var(--caption-weight); color:var(--caption-ink); }
.unit { order:var(--caption-order); text-align:right; font-size:var(--src-size); color:var(--ink-soft); margin:-6px 0 6px; }
.src { order:20; text-align:left; margin-top:var(--src-gap); font-size:var(--src-size); font-weight:var(--w-body); color:var(--ink-soft); line-height:1.5; white-space:pre-line; }
#figure::before { content:""; display:var(--title-tag); order:-2; width:46px; height:14px; background:var(--title-tag-color); margin-bottom:12px; }

</style>
</head>
<body>
<div id="figure"></div>
<script>
const FIGURE=/*__FIGURE_DATA__*/ null; const ICONS=/*__ICONS__*/ {};
(function(){
  const F=FIGURE, root=document.getElementById('figure');
  const L=F.layout||{}, MW=L.main||780, BW=L.branch||120, AW=L.action||520;

  if(F.title){ const hd=div('hd'); hd.append(t('h1',null,F.title)); root.append(hd); }

  (F.gates||[]).forEach((g,i)=>{
    const row=div('grow');
    const box=div('gate'); box.style.width=MW+'px';
    box.append(t('div','g1',g.num));
    box.append(t('div','g2',g.name));
    box.append(t('div','g3',g.count));
    if(g.principles){
      const pg=div('pgrid');
      g.principles.forEach(p=>{
        const c=div('p'); c.append(t('span','pn',p.id), t('span','pt',p.text)); pg.append(c);
      });
      box.append(pg);
    }
    row.append(box);
    if(g.fail){
      const b=div('br'); b.style.width=BW+'px'; row.append(b);
      const a=div('act'); a.style.width=AW+'px'; a.textContent=g.fail; row.append(a);
    }
    root.append(row);

    const dn=div('down'); dn.style.width=MW+'px'; dn.style.height='40px'; root.append(dn);
  });

  if(F.final){ const f=t('div','final',F.final); f.style.width=MW+'px'; root.append(f); }

  if(F.legend){
    const lg=div('legend'); lg.style.width=(MW+BW+AW)+'px';
    F.legend.forEach(it=>{
      const li=div('li'); li.append(div('ln '+(it._kind==='fail'?'fail':'pass')), t('span',null,it.text));
      lg.append(li);
    });
    root.append(lg);
  }
  if(F.caption) root.append(t('div','caption',F.caption));
  if(F.unit) root.append(t('div','unit',/^\(/.test(F.unit)?F.unit:'(단위: '+F.unit+')'));
  if(F.footnote) root.append(t('div','src',/^(주|※|Note)/.test(F.footnote)?F.footnote:'주: '+F.footnote));
  if(F.source) root.append(t('div','src',/^(자료|출처|Source)/.test(F.source)?F.source:'자료: '+F.source));

  window.__RENDER_DONE__=true;
  function div(c){const e=document.createElement('div');if(c)e.className=c;return e;}
  function t(tag,c,txt){const e=document.createElement(tag);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
})();
</script>
</body>
</html>
